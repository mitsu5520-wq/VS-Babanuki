<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VS ババ抜き β06 HOTEL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial}#app{position:relative;width:100vw;height:100vh;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:absolute;z-index:20;left:14px;right:14px;top:10px;display:flex;justify-content:space-between;pointer-events:none}.brand{font-weight:1000;font-size:20px;text-shadow:0 3px 12px #000}.brand small{font-size:10px;opacity:.6}.pill{padding:8px 11px;border-radius:999px;background:#090a0dc9;border:1px solid #ffffff20;font-size:11px;font-weight:900;backdrop-filter:blur(10px)}.controls{position:absolute;z-index:21;left:10px;right:10px;bottom:10px;display:flex;justify-content:center;gap:8px}.btn{border:1px solid #ffffff25;background:#090a0dd9;color:#fff;border-radius:13px;padding:10px 13px;font-weight:1000}.btn.main{background:linear-gradient(#ff6679,#d92d45)}.btn.alt{background:linear-gradient(#6b8dff,#3c58d9)}.toast{position:absolute;z-index:22;left:50%;top:48%;transform:translate(-50%,-50%);background:#090a0dd9;border:1px solid #ffffff22;border-radius:15px;padding:11px 16px;font-weight:1000;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}.overlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#4b3a2e,#07080b 72%)}.panel{width:min(720px,92vw);padding:28px;text-align:center;border-radius:28px;background:#101116ed;border:1px solid #ffffff20;box-shadow:0 25px 80px #0009}.panel h1{margin:0;font-size:clamp(38px,6vw,66px)}.panel p{opacity:.72;font-weight:800;line-height:1.6}.start{border:0;border-radius:16px;padding:14px 28px;background:linear-gradient(#ff6679,#d92d45);color:#fff;font-size:18px;font-weight:1000}.portrait{display:none;position:absolute;inset:0;z-index:99;background:#0a0b0e;align-items:center;justify-content:center;text-align:center;font-weight:1000}@media(orientation:portrait){.portrait{display:flex}}</style></head><body><div id="app"><div class="portrait">iPhoneを横向きにしてください。</div><div class="top"><div class="brand">VS ババ抜き <small>β06 HOTEL PRIVATE ROOM</small></div><div class="pill" id="view">席視点</div></div><div class="toast" id="toast"></div><div class="controls"><button class="btn main" id="seat">席視点</button><button class="btn alt" id="draw">引く視点</button><button class="btn" id="cards">手札 ON/OFF</button><button class="btn" id="orbit">シネマ回転</button></div><div class="overlay" id="overlay"><div class="panel"><h1>VS ババ抜き</h1><p>椅子をなくし、ホテル個室のような落ち着いた空間と円卓を主役にしたβ06。</p><button class="start" id="start">β06を試す</button></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>(()=>{const $=id=>document.getElementById(id),app=$('app'),view=$('view'),toast=$('toast');let tt;function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),900)}const sc=new THREE.Scene();sc.background=new THREE.Color(0x111216);sc.fog=new THREE.Fog(0x111216,12,34);const cam=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);cam.position.set(0,5,10.6);const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.15;r.physicallyCorrectLights=true;app.insertBefore(r.domElement,app.firstChild);function tex(base,noise=.05){let c=document.createElement('canvas');c.width=c.height=1024;let x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,1024,1024);for(let i=0;i<30000;i++){let a=Math.random()*noise;x.fillStyle=Math.random()>.5?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a})`;x.fillRect(Math.random()*1024,Math.random()*1024,1,1)}let t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=r.capabilities.getMaxAnisotropy();return t}const wallT=tex('#403a36',.05);wallT.repeat.set(2.5,1.5);const woodT=tex('#5b3627',.06);woodT.repeat.set(6,6);const feltT=tex('#26453b',.07);feltT.repeat.set(1.5,1.5);sc.add(new THREE.AmbientLight(0xffffff,.16));sc.add(new THREE.HemisphereLight(0xa8c5ff,0x241913,.55));let spot=new THREE.SpotLight(0xffd7b2,165,45,Math.PI/5,.35,1.3);spot.position.set(0,10.7,.2);spot.target.position.set(0,2.3,0);spot.castShadow=true;spot.shadow.mapSize.set(2048,2048);sc.add(spot,spot.target);let pl=new THREE.PointLight(0xffbf82,14,12,2);pl.position.set(-8,4.8,-7);sc.add(pl);let pr=new THREE.PointLight(0xffbf82,14,12,2);pr.position.set(8,4.8,-7);sc.add(pr);let blue=new THREE.PointLight(0x7da5ff,15,22,2);blue.position.set(-7,4.5,5);sc.add(blue);let floor=new THREE.Mesh(new THREE.PlaneGeometry(36,36),new THREE.MeshStandardMaterial({map:woodT,roughness:.86}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;sc.add(floor);let carpet=new THREE.Mesh(new THREE.CircleGeometry(7,64),new THREE.MeshStandardMaterial({color:0x15191f,roughness:.98}));carpet.rotation.x=-Math.PI/2;carpet.position.y=.01;sc.add(carpet);function wall(w,h,x,y,z,ry){let m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:wallT,roughness:.96}));m.position.set(x,y,z);m.rotation.y=ry;sc.add(m)}wall(36,13,0,6.5,-12,0);wall(24,13,-12,6.5,0,Math.PI/2);wall(24,13,12,6.5,0,-Math.PI/2);let dark=new THREE.MeshStandardMaterial({color:0x2a1c17,roughness:.78});let back=new THREE.Mesh(new THREE.BoxGeometry(36,2.2,.18),dark);back.position.set(0,1.1,-11.9);sc.add(back);for(let x of[-4.6,4.6]){let f=new THREE.Mesh(new THREE.BoxGeometry(2.2,3.1,.1),new THREE.MeshStandardMaterial({color:0x6d513b,roughness:.45,metalness:.18}));f.position.set(x,5,-11.84);sc.add(f);let i=new THREE.Mesh(new THREE.BoxGeometry(1.9,2.8,.06),new THREE.MeshStandardMaterial({color:0x7d7268,roughness:.85}));i.position.set(x,5,-11.78);sc.add(i)}let stem=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,2.1,14),new THREE.MeshStandardMaterial({color:0x23252b,metalness:.85,roughness:.45}));stem.position.set(0,11.1,0);sc.add(stem);let shade=new THREE.Mesh(new THREE.CylinderGeometry(1.35,.98,1.08,32,1,true),new THREE.MeshStandardMaterial({color:0x101116,metalness:.45,roughness:.55,side:THREE.DoubleSide}));shade.position.set(0,9.7,0);sc.add(shade);let top=new THREE.Mesh(new THREE.CylinderGeometry(4.75,4.86,.42,80),new THREE.MeshStandardMaterial({map:woodT,roughness:.58,metalness:.06}));top.position.y=2.04;top.castShadow=true;top.receiveShadow=true;sc.add(top);let under=new THREE.Mesh(new THREE.CylinderGeometry(4.98,5.08,.2,80),dark);under.position.y=1.75;under.castShadow=true;sc.add(under);let felt=new THREE.Mesh(new THREE.CylinderGeometry(4.15,4.15,.06,80),new THREE.MeshStandardMaterial({map:feltT,roughness:.96}));felt.position.y=2.27;felt.receiveShadow=true;sc.add(felt);let ring=new THREE.Mesh(new THREE.TorusGeometry(4.2,.12,24,100),new THREE.MeshStandardMaterial({color:0x8a6940,roughness:.24,metalness:.88}));ring.rotation.x=Math.PI/2;ring.position.y=2.31;sc.add(ring);let ped=new THREE.Mesh(new THREE.CylinderGeometry(.45,.72,1.8,28),new THREE.MeshStandardMaterial({map:woodT,roughness:.68}));ped.position.y=.95;ped.castShadow=true;sc.add(ped);let foot=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2,.14,36),dark);foot.position.y=.08;sc.add(foot);function cardT(back=false,face='A',suit='♠'){let c=document.createElement('canvas');c.width=340;c.height=500;let x=c.getContext('2d');if(back){let g=x.createLinearGradient(0,0,340,500);g.addColorStop(0,'#142855');g.addColorStop(.5,'#244f8b');g.addColorStop(1,'#162b4e');x.fillStyle=g;x.fillRect(0,0,340,500);x.strokeStyle='#eadfce';x.lineWidth=12;x.strokeRect(8,8,324,484);x.fillStyle='#ffffffaa';x.font='bold 90px Arial';x.textAlign='center';x.fillText('VS',170,275)}else{x.fillStyle='#f7f4ec';x.fillRect(0,0,340,500);let red=suit==='♥'||suit==='♦'||face==='JOKER';x.fillStyle=red?'#c51f31':'#161616';x.font='bold 54px Arial';x.textAlign='left';x.fillText(face,18,58);x.font='52px Arial';x.fillText(suit,20,112);x.font='bold 130px Arial';x.textAlign='center';x.fillText(face==='JOKER'?'★':suit,170,300)}return new THREE.CanvasTexture(c)}const cg=new THREE.BoxGeometry(.86,.055,1.24),side=new THREE.MeshStandardMaterial({color:0xe5dfd2,roughness:.82}),backT=cardT(true);function card(face,suit,up){let ft=cardT(false,face,suit),fm=new THREE.MeshStandardMaterial({map:ft,roughness:.72}),bm=new THREE.MeshStandardMaterial({map:backT,roughness:.64});let m=new THREE.Mesh(cg,[side,side,up?fm:bm,bm,side,side]);m.castShadow=true;return m}const hands=new THREE.Group();sc.add(hands);let P=[['4','♠'],['10','♥'],['Q','♦'],['JOKER','★'],['7','♣'],['A','♥']];P.forEach((d,i)=>{let t=i/5-.5,m=card(d[0],d[1],true);m.position.set(t*4.15,2.92,4.7-Math.abs(t)*.34);m.rotation.set(-.16,-t*.5,0);hands.add(m)});for(let i=0;i<6;i++){let t=i/5-.5,m=card('A','♠',false);m.position.set(t*3.7,2.88,-4.42+Math.abs(t)*.28);m.rotation.set(-.14,Math.PI+t*.42,0);hands.add(m)};let C=[['K','♠'],['K','♣'],['5','♥'],['5','♦'],['9','♠'],['9','♥']];C.forEach((d,i)=>{let m=card(d[0],d[1],true);m.position.set(((i%3)-1)*.76,2.33+i*.008,Math.floor(i/3)*.56-.3);m.rotation.y=-.34+i*.17;hands.add(m)});let seatP=new THREE.Vector3(0,5,10.6),seatL=new THREE.Vector3(0,2.3,.95),drawP=new THREE.Vector3(0,4.35,5.25),drawL=new THREE.Vector3(0,2.95,-4.05),tp=seatP.clone(),tl=seatL.clone(),look=seatL.clone(),orb=0,ot=0,visible=1;function mode(m){orb=0;if(m==='seat'){tp.copy(seatP);tl.copy(seatL);view.textContent='席視点';say('席視点')}else{tp.copy(drawP);tl.copy(drawL);view.textContent='引く視点';say('引く視点')}}function loop(){requestAnimationFrame(loop);if(orb){ot+=.0035;tp.set(Math.sin(ot)*10.8,5.2+Math.sin(ot*2)*.16,Math.cos(ot)*10.8);tl.set(0,2.28,0);view.textContent='シネマ回転'}cam.position.lerp(tp,.055);look.lerp(tl,.06);cam.lookAt(look);r.render(sc,cam)}loop();$('start').onclick=()=>{$('overlay').style.display='none';say('ホテル個室風 β06')};$('seat').onclick=()=>mode('seat');$('draw').onclick=()=>mode('draw');$('cards').onclick=()=>{visible=!visible;hands.visible=!!visible;say(visible?'手札表示':'手札非表示')};$('orbit').onclick=()=>{orb=!orb;if(!orb)mode('seat');else say('シネマ回転')};addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})})();</script></body></html>
