<div id="app"><div class="portrait">iPhoneを横向きにしてください。<br>VS ババ抜き β05 は横画面専用です。</div><div class="top"><div class="brand">VS ババ抜き <small>β05 REAL ROOM</small></div><div class="hud"><div class="pill">円卓リアル版</div><div class="pill" id="viewPill">席視点</div></div></div><div class="toast" id="toast"></div><div class="help">今回は背景・円卓・照明の雰囲気確認用です。</div><div class="controls"><button class="btn main" id="seatBtn">席視点</button><button class="btn alt" id="drawBtn">引く視点</button><button class="btn" id="showHideBtn">手札 ON / OFF</button><button class="btn" id="cinemaBtn">シネマ回転</button><button class="btn" id="resetBtn">リセット</button></div><div class="overlay" id="overlay"><div class="panel"><h1>VS ババ抜き</h1><div class="sub">背景・円卓・照明を先にガチで作るβ05。<br>静かな空間で、向かい合ってババ抜きしている雰囲気だけを先に磨く。</div><button class="start" id="startBtn">リアル版を試す</button><div class="note">今回はゲーム処理よりも、リアルな空間・円卓・カメラの確認が目的です。</div></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id),app=$('app'),viewPill=$('viewPill'),toastEl=$('toast');let toastTimer=null;function toast(msg,ms=1200){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('on'),ms)}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111216);scene.fog=new THREE.Fog(0x111216,10,33);const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,100);camera.position.set(0,5.2,10.8);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.physicallyCorrectLights=true;app.insertBefore(renderer.domElement,app.firstChild);

function cardTexture(face='A',suit='♠',back=false){const c=document.createElement('canvas');c.width=340;c.height=500;const x=c.getContext('2d');if(back){const g=x.createLinearGradient(0,0,340,500);g.addColorStop(0,'#142855');g.addColorStop(.5,'#244f8b');g.addColorStop(1,'#162b4e');x.fillStyle=g;x.fillRect(0,0,340,500);x.strokeStyle='#eadfce';x.lineWidth=12;x.strokeRect(8,8,324,484);x.strokeStyle='rgba(255,255,255,.26)';x.lineWidth=3;x.strokeRect(28,28,284,444);x.fillStyle='rgba(255,255,255,.62)';x.textAlign='center';x.textBaseline='middle';x.font='bold 90px Arial';x.fillText('VS',170,250)}else{x.fillStyle='#f7f4ec';x.fillRect(0,0,340,500);x.strokeStyle='#d8d3c8';x.lineWidth=5;x.strokeRect(5,5,330,490);const red=suit==='♥'||suit==='♦'||face==='JOKER';x.fillStyle=red?'#c51f31':'#161616';x.font='bold 54px Arial';x.textAlign='left';x.textBaseline='alphabetic';x.fillText(face,18,58);x.font='52px Arial';x.fillText(suit,20,110);x.textAlign='center';x.textBaseline='middle';x.font='bold 130px Arial';x.fillText(face==='JOKER'?'🃏':suit,170,270)}const t=new THREE.CanvasTexture(c);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}
scene.add(new THREE.AmbientLight(0xffffff,.18));scene.add(new THREE.HemisphereLight(0xaac6ff,0x2a1b14,.55));const mainSpot=new THREE.SpotLight(0xffd7b5,160,45,Math.PI/5,.35,1.2);mainSpot.position.set(0,10.5,.2);mainSpot.target.position.set(0,2.3,0);mainSpot.castShadow=true;mainSpot.shadow.mapSize.set(2048,2048);scene.add(mainSpot);scene.add(mainSpot.target);const fillBlue=new THREE.PointLight(0x81a6ff,18,25,2);fillBlue.position.set(-7,4.5,5);scene.add(fillBlue);const fillWarm=new THREE.PointLight(0xff9e69,10,20,2);fillWarm.position.set(6,4,-5);scene.add(fillWarm);
function wallLamp(x,z,ry){const metal=new THREE.MeshStandardMaterial({color:0x2b2d34,roughness:.55,metalness:.75}),glass=new THREE.MeshStandardMaterial({color:0xfff1d4,roughness:.18,emissive:0xffc893,emissiveIntensity:.5,side:THREE.DoubleSide}),g=new THREE.Group(),base=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.18,18),metal),shade=new THREE.Mesh(new THREE.ConeGeometry(.26,.48,24,1,true),glass);base.rotation.z=Math.PI/2;shade.rotation.z=-Math.PI/2;shade.position.x=.22;g.add(base,shade);g.position.set(x,4.4,z);g.rotation.y=ry;scene.add(g);const l=new THREE.PointLight(0xffc68d,9,9,2);l.position.set(x,4.38,z);scene.add(l)}wallLamp(-9.5,-7.2,Math.PI/2);wallLamp(9.5,-7.2,-Math.PI/2);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(34,34),new THREE.MeshStandardMaterial({map:woodTex,roughness:.86,metalness:.03}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const rug=new THREE.Mesh(new THREE.CircleGeometry(6.4,64),new THREE.MeshStandardMaterial({color:0x1c2027,roughness:.98}));rug.rotation.x=-Math.PI/2;rug.position.y=.01;rug.receiveShadow=true;scene.add(rug);
function addWall(w,h,x,y,z,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:wallTex,roughness:.96}));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m)}addWall(34,13,0,6.5,-12,0);addWall(24,13,-12,6.5,0,Math.PI/2);addWall(24,13,12,6.5,0,-Math.PI/2);
const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(34,34),new THREE.MeshStandardMaterial({color:0x15171c,roughness:.95}));ceiling.rotation.x=Math.PI/2;ceiling.position.y=13;scene.add(ceiling);for(let i=-4;i<=4;i+=2){const p=new THREE.Mesh(new THREE.BoxGeometry(1.3,2.2,.12),new THREE.MeshStandardMaterial({color:0x3c3531,roughness:.82}));p.position.set(i,4.7,-11.88);scene.add(p)}const pendantStem=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,1.9,14),new THREE.MeshStandardMaterial({color:0x24262d,roughness:.45,metalness:.85}));pendantStem.position.set(0,11.3,0);scene.add(pendantStem);const pendantOuter=new THREE.Mesh(new THREE.CylinderGeometry(1.3,.95,1.05,32,1,true),new THREE.MeshStandardMaterial({color:0x0f1014,roughness:.55,metalness:.45,side:THREE.DoubleSide}));pendantOuter.position.set(0,10.05,0);scene.add(pendantOuter);const pendantInner=new THREE.Mesh(new THREE.CylinderGeometry(1.06,.78,.92,32,1,true),new THREE.MeshStandardMaterial({color:0xffe2b9,roughness:.32,emissive:0xffcf96,emissiveIntensity:.22,side:THREE.DoubleSide}));pendantInner.position.set(0,10,0);scene.add(pendantInner);
const tableGroup=new THREE.Group();scene.add(tableGroup);const tableShadow=new THREE.Mesh(new THREE.CircleGeometry(5.15,64),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.18}));tableShadow.rotation.x=-Math.PI/2;tableShadow.position.y=.012;scene.add(tableShadow);const tableTop=new THREE.Mesh(new THREE.CylinderGeometry(4.7,4.82,.38,72),new THREE.MeshStandardMaterial({map:woodTex,roughness:.64,metalness:.05}));tableTop.position.y=2.02;tableTop.castShadow=true;tableTop.receiveShadow=true;tableGroup.add(tableTop);const tableUnder=new THREE.Mesh(new THREE.CylinderGeometry(4.9,5.02,.2,72),new THREE.MeshStandardMaterial({color:0x372117,roughness:.78}));tableUnder.position.y=1.76;tableUnder.castShadow=true;tableGroup.add(tableUnder);const felt=new THREE.Mesh(new THREE.CylinderGeometry(4.12,4.12,.06,72),new THREE.MeshStandardMaterial({map:feltTex,roughness:.96}));felt.position.y=2.24;felt.receiveShadow=true;tableGroup.add(felt);const brassRing=new THREE.Mesh(new THREE.TorusGeometry(4.18,.12,24,100),new THREE.MeshStandardMaterial({color:0x8a6a3c,roughness:.28,metalness:.85}));brassRing.rotation.x=Math.PI/2;brassRing.position.y=2.28;tableGroup.add(brassRing);const pedestalTop=new THREE.Mesh(new THREE.CylinderGeometry(.58,.68,.72,28),new THREE.MeshStandardMaterial({map:woodTex,roughness:.62}));pedestalTop.position.y=1.45;pedestalTop.castShadow=true;tableGroup.add(pedestalTop);const pedestalMid=new THREE.Mesh(new THREE.CylinderGeometry(.34,.46,1.45,24),new THREE.MeshStandardMaterial({color:0x44291d,roughness:.72}));pedestalMid.position.y=.72;pedestalMid.castShadow=true;tableGroup.add(pedestalMid);const pedestalFoot=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.95,.14,36),new THREE.MeshStandardMaterial({color:0x2b1913,roughness:.84}));pedestalFoot.position.y=.08;pedestalFoot.castShadow=true;tableGroup.add(pedestalFoot);
function chair(x,z,rot){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0x261c18,roughness:.88}),wood=new THREE.MeshStandardMaterial({color:0x3d261c,roughness:.74}),seat=new THREE.Mesh(new THREE.BoxGeometry(2.05,.18,1.7),mat),cushion=new THREE.Mesh(new THREE.BoxGeometry(1.9,.08,1.55),new THREE.MeshStandardMaterial({color:0x3b404a,roughness:.96})),back=new THREE.Mesh(new THREE.BoxGeometry(1.95,1.85,.16),mat),legGeo=new THREE.BoxGeometry(.12,1.1,.12);seat.position.y=1.18;cushion.position.y=1.29;back.position.set(0,2,-.72);for(const lx of[-.86,.86])for(const lz of[-.62,.62]){const leg=new THREE.Mesh(legGeo,wood);leg.position.set(lx,.55,lz);g.add(leg)}g.add(seat,cushion,back);g.position.set(x,0,z);g.rotation.y=rot;g.traverse(m=>{if(m.isMesh)m.castShadow=true});scene.add(g)}chair(0,6.35,0);chair(0,-6.35,Math.PI);chair(-6.2,0,Math.PI/2);chair(6.2,0,-Math.PI/2);
const sideMat=new THREE.MeshStandardMaterial({color:0xe5dfd2,roughness:.82}),cardGeo=new THREE.BoxGeometry(.86,.055,1.24);function cardMesh(face='A',suit='♠',faceUp=true){const frontMat=new THREE.MeshStandardMaterial({map:cardTexture(face,suit,false),roughness:.72}),backMat=new THREE.MeshStandardMaterial({map:cardTexture(face,suit,true),roughness:.62}),m=new THREE.Mesh(cardGeo,[sideMat,sideMat,faceUp?frontMat:backMat,backMat,sideMat,sideMat]);m.castShadow=true;m.receiveShadow=true;return m}
const playerHand=new THREE.Group(),opponentHand=new THREE.Group(),centerCards=new THREE.Group();scene.add(playerHand);scene.add(opponentHand);scene.add(centerCards);(()=>{const p=[['4','♠'],['10','♥'],['Q','♦'],['JOKER','★'],['7','♣'],['A','♥']];p.forEach((d,i)=>{const t=i/(p.length-1)-.5,c=cardMesh(d[0],d[1],true);c.position.set(t*4,2.92,4.65-Math.abs(t)*.35);c.rotation.set(-.15,-t*.48,0);playerHand.add(c)});for(let i=0;i<6;i++){const t=i/5-.5,c=cardMesh('A','♠',false);c.position.set(t*3.6,2.86,-4.38+Math.abs(t)*.28);c.rotation.set(-.14,Math.PI+t*.42,0);opponentHand.add(c)}const pairs=[['K','♠'],['K','♣'],['5','♥'],['5','♦'],['9','♠'],['9','♥']];pairs.forEach((d,i)=>{const c=cardMesh(d[0],d[1],true);c.position.set(((i%3)-1)*.72,2.31+i*.008,Math.floor(i/3)*.54-.3);c.rotation.set(0,-.34+i*.17,0);centerCards.add(c)})})();
let handsVisible=true;function setHandsVisible(v){handsVisible=v;playerHand.visible=v;opponentHand.visible=v;centerCards.visible=v;$('showHideBtn').textContent=v?'手札 ON / OFF':'手札 OFF → ON';toast(v?'手札を表示':'手札を非表示',900)}
const seatPos=new THREE.Vector3(0,5.2,10.8),seatLook=new THREE.Vector3(0,2.25,.8),drawPos=new THREE.Vector3(0,4.45,5.25),drawLook=new THREE.Vector3(0,2.9,-4);let targetPos=seatPos.clone(),targetLook=seatLook.clone(),currentLook=seatLook.clone(),cinema=false,cinemaT=0,currentMode='seat';function setView(name){currentMode=name;cinema=false;if(name==='seat'){targetPos.copy(seatPos);targetLook.copy(seatLook);viewPill.textContent='席視点';toast('席に座っている視点',950)}else{targetPos.copy(drawPos);targetLook.copy(drawLook);viewPill.textContent='引く視点';toast('相手から引く時の視点',950)}}function resetScene(){setView('seat');setHandsVisible(true);cinema=false;toast('リセットしました',900)}
function animate(){requestAnimationFrame(animate);if(cinema){cinemaT+=.0035;const r=10.4;targetPos.set(Math.sin(cinemaT)*r,5.4+Math.sin(cinemaT*2)*.18,Math.cos(cinemaT)*r);targetLook.set(0,2.24,0);viewPill.textContent='シネマ回転'}camera.position.lerp(targetPos,.055);currentLook.lerp(targetLook,.06);camera.lookAt(currentLook);const time=performance.now()*.001;playerHand.children.forEach((c,i)=>c.position.y=2.92+Math.sin(time*1.6+i*.4)*.008);opponentHand.children.forEach((c,i)=>c.position.y=2.86+Math.sin(time*1.3+i*.3)*.006);renderer.render(scene,camera)}animate();
$('startBtn').onclick=()=>{$('overlay').style.display='none';toast('まずは背景と円卓の雰囲気を見てください',1300)};$('seatBtn').onclick=()=>setView('seat');$('drawBtn').onclick=()=>setView('draw');$('showHideBtn').onclick=()=>setHandsVisible(!handsVisible);$('cinemaBtn').onclick=()=>{cinema=!cinema;if(cinema){toast('シネマ回転を開始',900);viewPill.textContent='シネマ回転'}else setView(currentMode)};$('resetBtn').onclick=()=>resetScene();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
