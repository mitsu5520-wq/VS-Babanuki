t.getElementById(id),app=$('app'),toastEl=$('toast'),lightPill=$('lightPill'),viewPill=$('viewPill');let tt;function toast(t){toastEl.textContent=t;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),900)}const scene=new THREE.Scene();scene.background=new THREE.Color(0x090a0d);scene.fog=new THREE.Fog(0x090a0d,16,48);const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,120);camera.position.set(0,4.25,9.1);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;app.insertBefore(renderer.domElement,app.firstChild);function ctex(draw){const c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');draw(x);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}const wood=ctex(x=>{let g=x.createLinearGradient(0,0,1024,1024);g.addColorStop(0,'#6b402e');g.addColorStop(.5,'#3b2118');g.addColorStop(1,'#7b503b');x.fillStyle=g;x.fillRect(0,0,1024,1024);for(let i=0;i<2500;i++){x.fillStyle=Math.random()>.5?'rgba(255,255,255,.03)':'rgba(0,0,0,.07)';x.fillRect(0,Math.random()*1024,1024,Math.random()*4+1)}});wood.repeat.set(6,6);const felt=ctex(x=>{x.fillStyle='#6b211c';x.fillRect(0,0,1024,1024);for(let i=0;i<50000;i++){x.fillStyle='rgba(255,255,255,'+(Math.random()*.04)+')';x.fillRect(Math.random()*1024,Math.random()*1024,1,1)}});const carpet=ctex(x=>{x.fillStyle='#11161d';x.fillRect(0,0,1024,1024);for(let i=0;i<35000;i++){x.fillStyle='rgba(255,255,255,'+(Math.random()*.025)+')';x.fillRect(Math.random()*1024,Math.random()*1024,1,1)}});const wallTex=ctex(x=>{let g=x.createLinearGradient(0,0,0,1024);g.addColorStop(0,'#251b1d');g.addColorStop(.5,'#37282b');g.addColorStop(1,'#181214');x.fillStyle=g;x.fillRect(0,0,1024,1024)});const gold=new THREE.MeshPhysicalMaterial({color:0xb78d48,metalness:.94,roughness:.22}),woodMat=new THREE.MeshPhysicalMaterial({map:wood,roughness:.54,clearcoat:.18}),dark=new THREE.MeshPhysicalMaterial({color:0x2e1b15,roughness:.7}),feltMat=new THREE.MeshStandardMaterial({map:felt,roughness:.98}),wallMat=new THREE.MeshStandardMaterial({map:wallTex,roughness:.96});const floor=new THREE.Mesh(new THREE.PlaneGeometry(44,44),new THREE.MeshStandardMaterial({map:wood,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const rug=new THREE.Mesh(new THREE.CircleGeometry(8.4,72),new THREE.MeshStandardMaterial({map:carpet,roughness:.99}));rug.rotation.x=-Math.PI/2;rug.position.y=.01;scene.add(rug);function wall(w,h,x,y,z,ry){const g=new THREE.Group(),p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),wallMat);g.add(p);for(const xx of[-w/2,w/2]){const m=new THREE.Mesh(new THREE.BoxGeometry(.14,h,.14),gold);m.position.set(xx,0,.07);g.add(m)}for(const yy of[-h/2,h/2]){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.16,.14),gold);m.position.set(0,yy,.07);g.add(m)}g.position.set(x,y,z);g.rotation.y=ry;scene.add(g)}wall(42,14,0,7,-14,0);wall(28,14,-14,7,0,Math.PI/2);wall(28,14,14,7,0,-Math.PI/2);function cityPanel(x,z,w,h){const c=document.createElement('canvas');c.width=700;c.height=900;const q=c.getContext('2d'),gr=q.createLinearGradient(0,0,0,900);gr.addColorStop(0,'#0b1730');gr.addColorStop(1,'#060b14');q.fillStyle=gr;q.fillRect(0,0,700,900);for(let i=0;i<60;i++){let bw=20+Math.random()*70,bh=180+Math.random()*560,bx=Math.random()*(700-bw),by=900-bh;q.fillStyle='#111722';q.fillRect(bx,by,bw,bh);for(let yy=by+12;yy<900;yy+=16)for(let xx=bx+7;xx<bx+bw-4;xx+=11)if(Math.random()>.55){q.fillStyle=Math.random()>.7?'#ffe1a5':'#8fbaff';q.fillRect(xx,yy,4,6)}}const tex=new THREE.CanvasTexture(c),m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex}));m.position.set(x,6.3,z);scene.add(m);const frame=new THREE.Mesh(new THREE.BoxGeometry(w+.25,h+.25,.18),dark);frame.position.set(x,6.3,z+.06);scene.add(frame);m.position.z=z+.18}cityPanel(-5.6,-13.78,4.2,8.0);cityPanel(0,-13.78,5.1,9.0);cityPanel(5.6,-13.78,4.2,8.0);const table=new THREE.Group();scene.add(table);let top=new THREE.Mesh(new THREE.CylinderGeometry(5.25,5.4,.48,88),woodMat);top.position.y=2.08;top.castShadow=true;table.add(top);let pad=new THREE.Mesh(new THREE.CylinderGeometry(4.66,4.66,.09,88),feltMat);pad.position.y=2.35;table.add(pad);let ring=new THREE.Mesh(new THREE.TorusGeometry(4.76,.11,24,120),gold);ring.rotation.x=Math.PI/2;ring.position.y=2.39;table.add(ring);let apron=new THREE.Mesh(new THREE.CylinderGeometry(5.44,5.58,.26,88),dark);apron.position.y=1.82;table.add(apron);let stem=new THREE.Mesh(new THREE.CylinderGeometry(.46,.62,1.5,30),dark);stem.position.y=.76;table.add(stem);let foot=new THREE.Mesh(new THREE.CylinderGeometry(2.05,2.28,.18,40),dark);foot.position.y=.09;table.add(foot);function chair(a){const g=new THREE.Group(),r=6.95;g.position.set(Math.sin(a)*r,0,Math.cos(a)*r);g.rotation.y=a+Math.PI;let s=new THREE.Mesh(new THREE.BoxGeometry(1.9,.34,1.9),dark);s.position.y=1.4;g.add(s);let b=new THREE.Mesh(new THREE.BoxGeometry(1.9,2.3,.34),new THREE.MeshPhysicalMaterial({color:0x55231f,roughness:.8}));b.position.set(0,2.4,-.78);g.add(b);for(const x of[-.96,.96]){let arm=new THREE.Mesh(new THREE.BoxGeometry(.26,.86,1.45),dark);arm.position.set(x,1.82,-.02);g.add(arm)}scene.add(g)}chair(Math.PI);chair(-1.2);chair(0);chair(1.2);function cardTex(face,suit,back){const c=document.createElement('canvas');c.width=340;c.height=500;const x=c.getContext('2d');if(back){x.fillStyle='#17325d';x.fillRect(0,0,340,500);x.strokeStyle='#eadfce';x.lineWidth=12;x.strokeRect(8,8,324,484);x.fillStyle='rgba(255,255,255,.7)';x.textAlign='center';x.textBaseline='middle';x.font='bold 92px Arial';x.fillText('VS',170,250)}else{x.fillStyle='#f8f5ed';x.fillRect(0,0,340,500);x.fillStyle=(suit==='♥'||suit==='♦')?'#c31d31':'#141414';x.font='bold 54px Arial';x.fillText(face,20,60);x.font='52px Arial';x.fillText(suit,20,112);x.textAlign='center';x.textBaseline='middle';x.font='bold 132px Arial';x.fillText(suit,170,265)}return new THREE.CanvasTexture(c)}const cg=new THREE.BoxGeometry(.86,.05,1.24),side=new THREE.MeshStandardMaterial({color:0xe3dccf,roughness:.86});function card(f,s,up){let fm=new THREE.MeshPhysicalMaterial({map:cardTex(f,s,false),roughness:.72}),bm=new THREE.MeshPhysicalMaterial({map:cardTex(f,s,true),roughness:.62});return new THREE.Mesh(cg,[side,side,up?fm:bm,bm,side,side])}const player=new THREE.Group(),others=new THREE.Group(),discards=new THREE.Group();scene.add(player,others,discards);[['3','♥'],['7','♥'],['9','♠'],['10','♣'],['Q','♥'],['K','♠']].forEach((d,i)=>{let t=i/5-.5,c=card(d[0],d[1],true);c.position.set(t*4.7,1.23,5.30-Math.abs(t)*.28);c.rotation.set(-.56,-t*.46,0);player.add(c)});function far(x,z,ry,n){const h=new THREE.Group();for(let i=0;i<n;i++){let t=i/(n-1)-.5,c=card('A','♠',false);c.position.set(t*2.1,3.05,0);c.rotation.set(-.1,Math.PI+t*.22,0);h.add(c)}h.position.set(x,0,z);h.rotation.y=ry;others.add(h)}far(-5.2,-4.3,.6,4);far(0,-5.5,0,5);far(5.2,-4.3,-.6,4);[['6','♠',-1.6,.06],['6','♥',-.9,.02],['8','♣',.3,-.48],['8','♦',1,-.36],['J','♥',2,.2],['J','♣',2.7,.26]].forEach((d,i)=>{let c=card(d[0],d[1],true);c.position.set(d[2],2.4+i*.008,d[3]);c.rotation.y=-.14+i*.11;discards.add(c)});scene.add(new THREE.AmbientLight(0xffffff,.07));const hemi=new THREE.HemisphereLight(0xe4d2bd,0x1a1411,.26);scene.add(hemi);const main=new THREE.SpotLight(0xffd0a2,185,55,Math.PI/4.5,.38,1.3);main.position.set(0,9.7,.6);main.target.position.set(0,2.25,0);main.castShadow=true;scene.add(main,main.target);const cool=new THREE.PointLight(0x82a7ff,11,26,2);cool.position.set(0,6.4,-12);scene.add(cool);const fillL=new THREE.PointLight(0xffb36f,12,18,2);fillL.position.set(-8.8,4.2,1.5);scene.add(fillL);const fillR=fillL.clone();fillR.position.x=8.8;scene.add(fillR);let lightMode=0,cardsVisible=true,orbit=false,orbitT=0,currentMode='seat';const seatPos=new THREE.Vector3(0,4.25,9.1),seatLook=new THREE.Vector3(0,2.3,.2),drawPos=new THREE.Vector3(0,4.05,5.55),drawLook=new THREE.Vector3(0,2.95,-4),targetPos=seatPos.clone(),targetLook=seatLook.clone(),look=seatLook.clone();function setView(m){currentMode=m;orbit=false;if(m==='seat'){targetPos.copy(seatPos);targetLook.copy(seatLook);viewPill.textContent='着席視点';toast('席に座っている視点')}else{targetPos.copy(drawPos);targetLook.copy(drawLook);viewPill.textContent='引く視点';toast('相手から引く時の視点')}}function setLight(){lightMode=(lightMode+1)%3;const names=['WARM','DRAMA','NIGHT'];lightPill.textContent=names[lightMode];if(lightMode===0){renderer.toneMappingExposure=1.02;main.intensity=185;cool.intensity=11;fillL.intensity=12;fillR.intensity=12}if(lightMode===1){renderer.toneMappingExposure=.92;main.intensity=210;cool.intensity=7;fillL.intensity=8;fillR.intensity=8}if(lightMode===2){renderer.toneMappingExposure=1.08;main.intensity=170;cool.intensity=16;fillL.intensity=9;fillR.intensity=9}toast('照明: '+names[lightMode])}function animate(){requestAnimationFrame(animate);if(orbit){orbitT+=.0032;let r=9.4;targetPos.set(Math.sin(orbitT)*r,4.4,Math.cos(orbitT)*r);targetLook.set(0,2.25,0);viewPill.textContent='360°回転'}camera.position.lerp(targetPos,.055);look.lerp(targetLook,.06);camera.lookAt(look);renderer.render(scene,camera)}animate();$('startBtn').onclick=()=>{$('overlay').style.display='none';toast('世界観と構図を見てみて')};$('seatBtn').onclick=()=>setView('seat');$('drawBtn').onclick=()=>setView('draw');$('orbitBtn').onclick=()=>{orbit=!orbit;if(!orbit)setView(currentMode);else toast('360°回転開始')};$('cardsBtn').onclick=()=>{cardsVisible=!cardsVisible;player.visible=others.visible=discards.visible=cardsVisible;toast(cardsVisible?'カードを表示':'カードを非表示')};$('lightBtn').onclick=setLight;$('resetBtn').onclick=()=>{orbit=false;lightMode=2;setLight();setView('seat');player.visible=others.visible=discards.visible=true;cardsVisible=true;toast('リセットしました')};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();</script></body></html>
