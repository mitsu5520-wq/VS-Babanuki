<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VS ババ抜き β07 PHOTO REAL</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial}#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#08090c}#photoBg{position:absolute;inset:-5%;z-index:0;background-image:linear-gradient(180deg,rgba(5,7,10,.18),rgba(5,7,10,.22) 45%,rgba(5,7,10,.48)),url('https://images.unsplash.com/photo-1784025173567-9ed10b66fdc1?auto=format&fit=crop&fm=jpg&q=82&w=2400');background-size:cover;background-position:center 54%;filter:saturate(.86) contrast(1.08) brightness(.72);transform:scale(1.06);transition:.9s cubic-bezier(.2,.75,.2,1)}#photoBg.draw{transform:scale(1.12) translateY(1.5%);filter:saturate(.82) contrast(1.1) brightness(.67) blur(.35px);background-position:center 50%}#vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 22%,rgba(4,5,8,.08) 58%,rgba(3,4,7,.46) 100%),linear-gradient(90deg,rgba(0,0,0,.2),transparent 20%,transparent 80%,rgba(0,0,0,.2))}canvas{position:absolute;inset:0;z-index:3;width:100%;height:100%;touch-action:none}.top{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:20;display:flex;justify-content:space-between;pointer-events:none}.brand{font-size:clamp(18px,2vw,26px);font-weight:1000;text-shadow:0 3px 16px #000}.brand small{font-size:.5em;opacity:.58;margin-left:8px}.hud{display:flex;gap:8px}.pill{padding:8px 11px;border-radius:999px;background:rgba(7,8,11,.66);border:1px solid #ffffff21;font-size:11px;font-weight:900;backdrop-filter:blur(12px)}.controls{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:21;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;pointer-events:none}.btn{pointer-events:auto;border:1px solid #ffffff24;background:rgba(7,8,11,.78);color:#fff;border-radius:14px;padding:10px 14px;font-size:12px;font-weight:1000;backdrop-filter:blur(14px)}.main{background:linear-gradient(#ff667a,#d92f49)}.alt{background:linear-gradient(#5f8bff,#3554d9)}.toast{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);z-index:22;padding:11px 16px;border-radius:15px;background:rgba(7,8,11,.82);border:1px solid #ffffff21;font-weight:1000;backdrop-filter:blur(14px);opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,-56%)}.credit{position:absolute;right:10px;bottom:58px;z-index:20;font-size:9px;opacity:.42;text-shadow:0 2px 6px #000}.overlay{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 35%,rgba(54,43,36,.78),rgba(6,7,10,.93) 72%)}.panel{width:min(760px,94vw);padding:30px 26px;border-radius:28px;background:rgba(12,13,17,.88);border:1px solid #ffffff24;box-shadow:0 30px 90px #0009;text-align:center}.panel h1{margin:0;font-size:clamp(38px,6vw,66px)}.sub{margin:8px 0 20px;opacity:.72;font-weight:800;line-height:1.6}.start{border:0;border-radius:16px;padding:14px 28px;background:linear-gradient(#ff667a,#d92f49);color:#fff;font-size:18px;font-weight:1000}.note{margin-top:12px;font-size:11px;opacity:.52;line-height:1.6}.portrait{display:none;position:absolute;inset:0;z-index:99;background:#0a0b0f;align-items:center;justify-content:center;text-align:center;font-weight:1000;line-height:1.7}@media(orientation:portrait){.portrait{display:flex}}</style></head><body><div id="app"><div id="photoBg"></div><div id="vignette"></div><div class="portrait">iPhoneを横向きにしてください。<br>VS ババ抜き β07 は横画面専用です。</div><div class="top"><div class="brand">VS ババ抜き <small>β07 PHOTO REAL</small></div><div class="hud"><div class="pill">実写背景</div><div class="pill" id="viewPill">席視点</div></div></div><div class="toast" id="toast"></div><div class="credit">Photo: Yanhao Fang / Unsplash</div><div class="controls"><button class="btn main" id="seatBtn">席視点</button><button class="btn alt" id="drawBtn">引く視点</button><button class="btn" id="cardsBtn">カード ON / OFF</button><button class="btn" id="tableBtn">円卓だけ確認</button><button class="btn" id="resetBtn">リセット</button></div><div class="overlay" id="overlay"><div class="panel"><h1>VS ババ抜き</h1><div class="sub">実写のホテル空間に、3D円卓とカードを馴染ませるβ07。</div><button class="start" id="startBtn">PHOTO REAL版を試す</button><div class="note">今回は現実っぽさの確認を最優先。</div></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>(()=>{const $=id=>document.getElementById(id),app=$('app'),bg=$('photoBg'),toastEl=$('toast'),view=$('viewPill');let tt;function toast(t,m=1000){toastEl.textContent=t;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),m)}const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(41,innerWidth/innerHeight,.1,100);cam.position.set(0,4.9,9.7);const r=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});r.setClearColor(0,0);r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.03;app.insertBefore(r.domElement,document.querySelector('.portrait'));function tex(base){let c=document.createElement('canvas');c.width=c.height=512;let x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,512,512);for(let i=0;i<1300;i++){x.fillStyle=Math.random()>.5?'#ffffff08':'#0000000c';x.fillRect(0,Math.random()*512,512,Math.random()*2+1)}let t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);return t}let wood=tex('#593828'),felt=tex('#263d36');sc.add(new THREE.HemisphereLight(0xe4dbd0,0x2b1b15,.48));let warm=new THREE.SpotLight(0xffc893,70,30,Math.PI/4,.5,1.3);warm.position.set(-1.2,8,3.5);warm.target.position.set(0,2.1,0);warm.castShadow=true;warm.shadow.mapSize.set(2048,2048);sc.add(warm,warm.target);let soft=new THREE.PointLight(0xa9b9d8,11,22,2);soft.position.set(5,4,6);sc.add(soft);let sh=new THREE.Mesh(new THREE.CircleGeometry(5.5,64),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.18,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.position.y=.03;sc.add(sh);let table=new THREE.Group();sc.add(table);let topm=new THREE.MeshPhysicalMaterial({map:wood,roughness:.48,clearcoat:.28}),dark=new THREE.MeshStandardMaterial({color:0x3c251b,roughness:.68}),brass=new THREE.MeshPhysicalMaterial({color:0x8d6c43,metalness:.92,roughness:.24}),fm=new THREE.MeshStandardMaterial({map:felt,roughness:.98});let slab=new THREE.Mesh(new THREE.CylinderGeometry(4.55,4.68,.34,96),topm);slab.position.y=2.05;slab.castShadow=true;table.add(slab);let under=new THREE.Mesh(new THREE.CylinderGeometry(4.72,4.86,.18,96),dark);under.position.y=1.79;under.castShadow=true;table.add(under);let inlay=new THREE.Mesh(new THREE.CylinderGeometry(4.02,4.02,.055,96),fm);inlay.position.y=2.245;table.add(inlay);let ring=new THREE.Mesh(new THREE.TorusGeometry(4.1,.1,24,128),brass);ring.rotation.x=Math.PI/2;ring.position.y=2.285;table.add(ring);let neck=new THREE.Mesh(new THREE.CylinderGeometry(.56,.74,.76,40),topm);neck.position.y=1.43;table.add(neck);let stem=new THREE.Mesh(new THREE.CylinderGeometry(.34,.45,1.35,36),dark);stem.position.y=.72;table.add(stem);let base=new THREE.Mesh(new THREE.CylinderGeometry(1.72,1.96,.15,48),dark);base.position.y=.09;table.add(base);function cardTex(face,suit,back=false){let c=document.createElement('canvas');c.width=340;c.height=500;let x=c.getContext('2d');if(back){x.fillStyle='#234d89';x.fillRect(0,0,340,500);x.strokeStyle='#eadfce';x.lineWidth=12;x.strokeRect(8,8,324,484);x.fillStyle='#ffffffaa';x.font='bold 88px Arial';x.textAlign='center';x.fillText('VS',170,275)}else{x.fillStyle='#f6f3ec';x.fillRect(0,0,340,500);let red=suit==='♥'||suit==='♦'||face==='JOKER';x.fillStyle=red?'#c51f31':'#151515';x.font='bold 54px Arial';x.textAlign='left';x.fillText(face,18,58);x.font='52px Arial';x.fillText(suit,18,110);x.textAlign='center';x.font='bold 128px Arial';x.fillText(face==='JOKER'?'🃏':suit,170,300)}return new THREE.CanvasTexture(c)}let cg=new THREE.BoxGeometry(.84,.052,1.2),edge=new THREE.MeshStandardMaterial({color:0xe7e0d4,roughness:.82});function mkCard(f,s,u=true){let fm=new THREE.MeshStandardMaterial({map:cardTex(f,s,false),roughness:.72}),bm=new THREE.MeshStandardMaterial({map:cardTex(f,s,true),roughness:.65});let m=new THREE.Mesh(cg,[edge,edge,u?fm:bm,bm,edge,edge]);m.castShadow=true;return m}let cards=new THREE.Group();sc.add(cards);let mine=[['4','♠'],['10','♥'],['Q','♦'],['JOKER','★'],['7','♣'],['A','♥']];mine.forEach((d,i)=>{let t=i/5-.5,m=mkCard(d[0],d[1],true);m.position.set(t*4,2.9,4.42-Math.abs(t)*.28);m.rotation.set(-.14,-t*.48,0);cards.add(m)});for(let i=0;i<6;i++){let t=i/5-.5,m=mkCard('A','♠',false);m.position.set(t*3.55,2.86,-4.05+Math.abs(t)*.24);m.rotation.set(-.12,Math.PI+t*.4,0);cards.add(m)}let cp=[new THREE.Vector3(0,4.9,9.7),new THREE.Vector3(0,4.25,5.8)],cl=[new THREE.Vector3(0,2.2,.6),new THREE.Vector3(0,2.85,-3.8)],tp=cp[0].clone(),tl=cl[0].clone(),lk=cl[0].clone(),visible=true;function setView(d){tp.copy(cp[d?1:0]);tl.copy(cl[d?1:0]);bg.classList.toggle('draw',d);view.textContent=d?'引く視点':'席視点';toast(d?'相手から引く距離感':'席に座った距離感')}function loop(){requestAnimationFrame(loop);cam.position.lerp(tp,.055);lk.lerp(tl,.06);cam.lookAt(lk);r.render(sc,cam)}loop();$('startBtn').onclick=()=>{$('overlay').style.display='none';toast('実写背景と円卓の馴染みを確認してみて',1400)};$('seatBtn').onclick=()=>setView(false);$('drawBtn').onclick=()=>setView(true);$('cardsBtn').onclick=()=>{visible=!visible;cards.visible=visible;toast(visible?'カードを表示':'カードを非表示')};$('tableBtn').onclick=()=>{cards.visible=false;toast('円卓だけ表示')};$('resetBtn').onclick=()=>{visible=true;cards.visible=true;setView(false);toast('リセットしました')};addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})})();</script></body></html>
